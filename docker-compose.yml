services:
  app:
    container_name: mariposa
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.mariposa.food}
    env_file:
      - backend/.env
      - ${DOCKER_DB_ENV_FILE:-.env.docker}
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    init: true
    restart: unless-stopped
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
      - ./backend/src/settings.json:/app/backend/dist/settings.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - Promise.all([fetch('http://127.0.0.1:8100/health'),fetch('http://127.0.0.1:8000')]).then(responses=>{if(responses.some(response=>!response.ok))process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:18-bookworm
    container_name: mariposa-db
    env_file:
      - ${DOCKER_DB_ENV_FILE:-.env.docker}
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    volumes:
      - mariposa-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariposa-db:
    name: mariposa-db
