services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mariposa-backend-prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@172.17.0.1:5432/${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      GAMMA_URL: ${GAMMA_URL}
      GAMMA_API_KEY: ${GAMMA_API_KEY}
      GAMMA_FOLDER_ID: ${GAMMA_FOLDER_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HUNTER_API_KEY: ${HUNTER_API_KEY}
      CHARGILY_SECRET: ${CHARGILY_SECRET}
      CHARGILY_BASE_URL: ${CHARGILY_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/data:/app/backend/data
    networks:
      - mariposa-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mariposa-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_APP_NAME: ${VITE_APP_NAME}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - mariposa-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mariposa-network:
    driver: bridge
